<body>

<script type="text/babel" src="tweaks-panel.jsx?v=20260701i"></script>
<script type="text/babel" src="components.jsx?v=20260701i"></script>
<script type="text/babel" src="chat-and-solutions.jsx?v=20260701i"></script>
<script type="text/babel" src="portfolio.jsx?v=20260701i"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentHue": 220,
  "videoOpacity": 0.55,
  "scanlineStrength": 0.015,
  "reducedMotion": false
}/*EDITMODE-END*/;

function App() {
  const [route, setRoute] = useState('home');
  const [chatOpen, setChatOpen] = useState(false);
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  useEffect(() => {
    const root = document.documentElement;
    root.style.setProperty('--neon', `oklch(0.85 0.15 ${tweaks.accentHue})`);
    root.style.setProperty('--neon-2', `oklch(0.78 0.18 ${tweaks.accentHue - 5})`);
    root.style.setProperty('--neon-deep', `oklch(0.55 0.18 ${tweaks.accentHue})`);
    root.style.setProperty('--video-opacity', String(tweaks.videoOpacity));
    root.style.setProperty('--scan-strength', String(tweaks.scanlineStrength));
  }, [tweaks]);

  useEffect(() => {
    const handleHash = () => {
      const h = (window.location.hash || '').replace('#', '');
      if (h === 'services' || h === 'solutions') { setRoute('solutions'); return; }
      if (h === 'portfolio') { setRoute('portfolio'); return; }
      if (h === 'pricing-full') { setRoute('pricing'); return; }
      if (h === 'home' || h === '') { setRoute('home'); return; }
    };
    handleHash();
    window.addEventListener('hashchange', handleHash);
    return () => window.removeEventListener('hashchange', handleHash);
  }, []);

  const navigate = (target, anchor) => {
    if (target === 'solutions') {
      window.location.hash = '#services';
      setRoute('solutions');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else if (target === 'portfolio') {
      window.location.hash = '#portfolio';
      setRoute('portfolio');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else if (target === 'pricing') {
      window.location.hash = '#pricing-full';
      setRoute('pricing');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      if (route !== 'home') {
        window.location.hash = '#home';
        setRoute('home');
        if (anchor) {
          setTimeout(() => {
            const el = document.getElementById(anchor);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 100);
        } else {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      } else {
        if (anchor) {
          const el = document.getElementById(anchor);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }
    }
  };

  return (
    <>
      <Nav route={route} navigate={navigate} />

      {/* HOME */}
      <div className={`page ${route === 'home' ? 'active' : ''}`} data-screen-label="home">
        <Hero onSpeak={() => setChatOpen(true)} />
        <BuiltFor />
        <WhatWeDo />
        <HowItWorks onSpeak={() => navigate('home', 'contact')} />
        <PricingTeaser onSpeak={() => setChatOpen(true)} navigate={navigate} />
        <GalaxyPanels />
        <FinalCTA onSpeak={() => navigate('home', 'contact')} />
        <Marquee />
        <Contact />
        <Footer navigate={navigate} />
      </div>

      {/* SERVICES */}
      <div className={`page ${route === 'solutions' ? 'active' : ''}`} data-screen-label="services">
        <SolutionsPage navigate={navigate} />
        <Marquee />
        <Footer navigate={navigate} />
      </div>

      {/* PORTFOLIO */}
      <div className={`page ${route === 'portfolio' ? 'active' : ''}`} data-screen-label="portfolio">
        <PortfolioPage navigate={navigate} />
        <Marquee />
        <Footer navigate={navigate} />
      </div>

      {/* FULL PRICING */}
      <div className={`page ${route === 'pricing' ? 'active' : ''}`} data-screen-label="pricing">
        <Pricing />
        <FinalCTA onSpeak={() => navigate('home', 'contact')} />
        <Footer navigate={navigate} />
      </div>

      {/* Chat */}
      <OriginChat open={chatOpen} setOpen={setChatOpen} navigate={navigate} />

      {/* Scanlines overlay */}
      {!tweaks.reducedMotion && tweaks.scanlineStrength > 0 && <div className="scanlines"></div>}

      {/* Tweaks panel */}
      <TweaksPanel title="Tweaks">
        <TweakSection label="Look" />
        <TweakSlider label="Accent hue" value={tweaks.accentHue}
          min={180} max={260} step={2} unit="°"
          onChange={(v) => setTweak('accentHue', v)} />
        <TweakSlider label="Video opacity" value={tweaks.videoOpacity}
          min={0} max={1} step={0.05}
          onChange={(v) => setTweak('videoOpacity', v)} />
        <TweakSlider label="Scanline strength" value={tweaks.scanlineStrength}
          min={0} max={0.06} step={0.005}
          onChange={(v) => setTweak('scanlineStrength', v)} />

        <TweakToggle label="Reduced motion" value={tweaks.reducedMotion}
          onChange={(v) => setTweak('reducedMotion', v)} />

        <TweakSection label="Quick nav" />
        <TweakButton label="→ Home"      onClick={() => navigate('home')} />
        <TweakButton label="→ Services"  onClick={() => navigate('solutions')} />
        <TweakButton label="→ Portfolio" onClick={() => navigate('portfolio')} />
        <TweakButton label="→ Pricing"   onClick={() => navigate('pricing')} />
        <TweakButton label="Open chat"   onClick={() => setChatOpen(true)} />
      </TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
